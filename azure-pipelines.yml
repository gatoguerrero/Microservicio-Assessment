trigger:
  branches:
    include:
      - main
      - master
      - develop

variables:
- group: vg-aks-liq

pool:
  vmImage: 'ubuntu-latest'

stages:

- stage: Tests
  displayName: 'TestAutomatizado'

  jobs:
  - job: RunTests
    displayName: 'TestsMaven'

    steps:

    - task: JavaToolInstaller@0
      displayName: 'InstalarJava'
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - script: |
        mvn clean verify
      workingDirectory: 'Microservicio'
      displayName: 'Test y Cobertura'


- stage: AnalisisEstatico
  displayName: 'Analisis estatico de Codigo con Sonar'

  dependsOn: Tests
  condition: succeeded()

  jobs:
  - job: SonarCloud
    displayName: 'Analisis con Sonar Cloud'

    steps:

    - task: JavaToolInstaller@0
      displayName: 'Use Java 17'
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - script: |
        mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=gatoguerrero_Microservicio-Assessment \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
      workingDirectory: 'Microservicio'
      displayName: 'Análisis de Sonar Cloud'
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)


- stage: Build
  displayName: 'Build Application'

  dependsOn: AnalisisEstatico
  condition: succeeded()

  jobs:
  - job: MavenBuild
    displayName: 'Build JAR'

    steps:

    - task: JavaToolInstaller@0
      displayName: 'Use Java 17'
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - script: |
        mvn clean package -DskipTests
      workingDirectory: 'Microservicio'
      displayName: 'Build JAR'

    - script: |
        ls -lh target/
      workingDirectory: 'Microservicio'
      displayName: 'Verify JAR'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish JAR artifact'
      inputs:
        targetPath: 'Microservicio/target/devops-svc-1.0.0.jar'
        artifact: 'application-jar'


- stage: Docker
  displayName: 'Docker Build y Push a ACR'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DockerBuild
    displayName: 'Build y Push Imagen Docker'

    steps:

    - task: DownloadPipelineArtifact@2
      displayName: 'Descargar JAR artifact'
      inputs:
        artifact: 'application-jar'
        path: '$(Pipeline.Workspace)/application-jar'

    - script: |
        mkdir -p Microservicio/target
        cp $(Pipeline.Workspace)/application-jar/devops-svc-1.0.0.jar Microservicio/target/devops-svc-1.0.0.jar
      displayName: 'Preparar JAR para Docker'

    - task: AzureCLI@2
      displayName: 'Build y Push a ACR'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr login --name acrassessmentdevops

          docker build \
            -t acrassessmentdevops.azurecr.io/devops-svc:$(Build.BuildId) \
            -t acrassessmentdevops.azurecr.io/devops-svc:latest \
            Microservicio

          docker push acrassessmentdevops.azurecr.io/devops-svc:$(Build.BuildId)
          docker push acrassessmentdevops.azurecr.io/devops-svc:latest
